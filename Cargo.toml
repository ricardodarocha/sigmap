[package]
name = "sigma"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["canvas", "tokio"] }
tokio = { version = "1.53.1", features = ["full"] }

[profile.release]
opt-level = "s"     
lto = true          
codegen-units = 1   
panic = "abort"     
strip = true   